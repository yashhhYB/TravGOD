# ==============================================================================
# TravGOD — Autonomous Post-Code DevSecOps Pipeline
# GitLab Transcend Hackathon ("Life After Code")
# Autonomy Level: Hands-off / Supervised Autonomous Agent Lifecycle
# DevSecOps Stages: All 9 Stages Covered (plan, create, verify, package, secure, release, configure, monitor, govern)
# ==============================================================================

image: node:20-alpine

variables:
  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"

stages:
  - plan
  - create
  - verify
  - package
  - secure
  - release
  - configure
  - monitor
  - govern
  - deploy

default:
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
      - .npm/

# ------------------------------------------------------------------------------
# 1. PLAN STAGE — Autonomous Issue & PR Triage Sentinel
# ------------------------------------------------------------------------------
ai_plan_triage:
  stage: plan
  script:
    - echo "Plan Triage Agent executing"
    - node scripts/ci/ai-plan-triage.mjs
  artifacts:
    name: "plan-triage-artifacts-${CI_COMMIT_SHORT_SHA}"
    paths:
      - ci-artifacts/plan-triage-report.json
      - ci-artifacts/plan-triage-summary.md
    expire_in: 30 days
  rules:
    - when: always

# ------------------------------------------------------------------------------
# 2. CREATE STAGE — Duo Automated Code Review & Static Syntax Linting
# ------------------------------------------------------------------------------
code_lint:
  stage: create
  before_script:
    - npm ci --prefer-offline --no-audit || npm install
  script:
    - echo "Running static lint and syntax validation"
    - npm run lint
  rules:
    - when: always

duo_code_review:
  stage: create
  needs: ["ai_plan_triage"]
  script:
    - echo "Code Review Agent evaluating source changes"
    - node scripts/ci/ai-code-review.mjs
  artifacts:
    name: "code-review-report-${CI_COMMIT_SHORT_SHA}"
    paths:
      - ci-artifacts/code-review-report.md
    expire_in: 30 days
  rules:
    - when: always

# ------------------------------------------------------------------------------
# 3. VERIFY STAGE — Unit Testing & Deterministic Safety Engine Verification
# ------------------------------------------------------------------------------
unit_tests:
  stage: verify
  before_script:
    - npm ci --prefer-offline --no-audit || npm install
  script:
    - echo "Executing automated unit test suite"
    - npm test
    - echo "Executing Deterministic Safety Audit Engine against Rome and Paris"
    - node mock/safety-audit.mjs
  rules:
    - when: always

# ------------------------------------------------------------------------------
# 4. PACKAGE STAGE — Optimized Vite 5 Bundle Packaging
# ------------------------------------------------------------------------------
package_build:
  stage: package
  needs: ["unit_tests"]
  before_script:
    - npm install --include=dev
  script:
    - echo "Bundling production application via Vite 5"
    - npx --yes vite build
  artifacts:
    name: "travgod-dist-${CI_COMMIT_SHORT_SHA}"
    paths:
      - dist/
    expire_in: 30 days
  rules:
    - when: always

# ------------------------------------------------------------------------------
# 5. SECURE STAGE — Secret Detection, SAST & AI Security Remediation
# ------------------------------------------------------------------------------
duo_security_remediation:
  stage: secure
  needs: ["package_build"]
  script:
    - echo "Security Remediation Agent running"
    - node scripts/ci/ai-security-remediation.mjs
  artifacts:
    name: "security-remediation-${CI_COMMIT_SHORT_SHA}"
    paths:
      - ci-artifacts/security-remediation-report.md
    expire_in: 30 days
  rules:
    - when: always

# ------------------------------------------------------------------------------
# 6. RELEASE STAGE — Semantic Changelog & AI Release Notes Generation
# ------------------------------------------------------------------------------
ai_semantic_release:
  stage: release
  needs: ["duo_security_remediation"]
  script:
    - echo "Generating autonomous semantic release notes"
    - node scripts/ci/ai-release-notes.mjs
  artifacts:
    name: "release-notes-${CI_COMMIT_SHORT_SHA}"
    paths:
      - ci-artifacts/release-notes.md
    expire_in: 30 days
  rules:
    - when: always

# ------------------------------------------------------------------------------
# 7. CONFIGURE STAGE — Environment Drift & Security Policy Verification
# ------------------------------------------------------------------------------
config_drift_check:
  stage: configure
  needs: ["package_build"]
  script:
    - echo "Checking config schema"
    - test -f package.json
    - test -f vite.config.js
  rules:
    - when: always

# ------------------------------------------------------------------------------
# 8. MONITOR STAGE — Synthetic Route Availability & Web Performance Budget
# ------------------------------------------------------------------------------
synthetic_health_check:
  stage: monitor
  needs: ["package_build"]
  script:
    - echo "Running synthetic health checks and bundle budget monitor"
    - node scripts/ci/ai-health-monitor.mjs
  artifacts:
    name: "health-monitor-${CI_COMMIT_SHORT_SHA}"
    paths:
      - ci-artifacts/health-monitor-report.md
    expire_in: 30 days
  rules:
    - when: always

# ------------------------------------------------------------------------------
# 9. GOVERN STAGE — Green SCI Carbon Audit & License Compliance
# ------------------------------------------------------------------------------
green_sci_carbon_audit:
  stage: govern
  needs: ["synthetic_health_check"]
  script:
    - echo "Calculating Software Carbon Intensity SCI"
    - node scripts/ci/green-sci-audit.mjs
  artifacts:
    name: "green-sci-sustainability-${CI_COMMIT_SHORT_SHA}"
    paths:
      - ci-artifacts/green-sci-report.md
      - ci-artifacts/sustainability-badge.json
    expire_in: 90 days
  rules:
    - when: always

license_compliance:
  stage: govern
  script:
    - echo "Verifying repository MIT License compliance"
    - test -f LICENSE
  rules:
    - when: always

# ------------------------------------------------------------------------------
# 10. DEPLOY STAGE — GitLab Pages Live Hosting
# ------------------------------------------------------------------------------
pages:
  stage: deploy
  needs: ["package_build", "green_sci_carbon_audit", "license_compliance"]
  script:
    - echo "Publishing production build to GitLab Pages"
    - rm -rf public
    - cp -r dist public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
